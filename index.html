  background-size:cover;background-position:center 40%;filter:grayscale(1) contrast(1.1);opacity:.13;z-index:0}
#bgveil{position:fixed;inset:0;background:linear-gradient(180deg,rgba(250,246,240,.9) 0%,rgba(250,246,240,.55) 100%);z-index:1}
#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;z-index:2}
.shell{position:relative;height:100%;display:flex;flex-direction:column;padding:34px 46px 0}

/* шапка */
.row1{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:22px;gap:16px}
.ideastop.on{font-weight:700;color:var(--t-h1)}
.date{font-weight:400;font-size:14px;line-height:1;letter-spacing:.1em;color:var(--t-mut)}
.row1r{display:flex;align-items:center;gap:20px}
.zoom{display:flex;align-items:center;gap:3px}
.zoom button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  background:transparent;border-radius:7px;color:var(--t-mut);font-size:16px;line-height:1;cursor:pointer;
  transition:color .14s ease,border-color .14s ease}
.zoom button:hover{color:var(--accent);border-color:var(--line-hi)}
.zoom #zVal{min-width:48px;text-align:center;font-size:13px;color:var(--t-mut);letter-spacing:.04em;cursor:pointer}
.row2{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:24px;flex-wrap:wrap}
.modeswrap{display:flex;align-items:center;gap:26px}
.titlerow{display:flex;align-items:baseline;gap:18px}
.tdiv{width:1px;height:20px;background:var(--line);align-self:center}
.ideastop input{font:inherit;font-family:inherit;font-size:22px;background:#fffdfa;border:1px solid var(--line-hi);border-radius:6px;padding:2px 8px;width:220px;color:inherit}
.ideastop{font-weight:400;font-size:27px;line-height:1;letter-spacing:-.015em;color:#b3a99c;background:transparent;border:none;padding:0;cursor:pointer;transition:color .15s ease;font-family:inherit}
.ideastop:not(.on):hover{color:var(--t-idle)}
#ideasBtn.on{font-weight:700;color:var(--t-h1)}
.modes{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.55);border:1px solid var(--line);padding:5px;border-radius:7px;height:50px}
.mode input{font:inherit;font-family:inherit;font-size:16px;background:#fffdfa;border:1px solid var(--line-hi);border-radius:5px;padding:2px 6px;width:120px;color:inherit}
.mode{font-weight:500;font-size:16px;line-height:1;color:var(--t-idle);padding:11px 22px;border-radius:5px;border:none;background:transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mode:hover{color:var(--t-task)}
.mode.on{font-weight:600;color:var(--accent);background:#fff;box-shadow:0 2px 6px rgba(180,110,60,.1)}
.mdiv{width:1px;height:24px;background:var(--line);margin:0 4px}
.mode .arw{color:var(--t-mut)}
.mode.on .arw{color:var(--accent)}
.projs{display:flex;gap:10px;align-items:stretch;height:50px}
.proj input{font:inherit;font-family:inherit;font-size:18px;background:#fffdfa;border:1px solid var(--line-hi);border-radius:6px;padding:2px 8px;width:140px;color:inherit}
.proj{display:flex;align-items:center;color:var(--t-proj);padding:0 22px;font-weight:600;font-size:18px;line-height:1;border:1px solid transparent;background:transparent;border-radius:7px;cursor:pointer;white-space:nowrap}
.proj:hover{color:var(--t-task)}
.proj.on{background:#fff;color:var(--accent);border-color:var(--line);box-shadow:0 2px 6px rgba(180,110,60,.1)}

/* контент */
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0}
.view.on{display:block}
.board{display:grid;gap:22px;align-items:start}
.view.qview{display:flex;flex-direction:column;min-height:0}
.queuewrap{flex:1;min-height:0;overflow-y:auto;max-height:none;padding-right:2px;scrollbar-gutter:stable}
.queuewrap .well{max-height:none}
.queuewrap .stack{overflow:visible}
.well{border-radius:12px;display:flex;flex-direction:column;overflow:hidden;max-height:770px}
.wellh{padding:20px 26px 14px;font-weight:600;font-size:14px;line-height:1;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.wellh .wname{cursor:text}
.wellh .wcap{font-weight:400;font-size:14px;line-height:1;letter-spacing:0;text-transform:none;color:#b08a68}
.wellh input{text-transform:none;letter-spacing:0;font-weight:600;font-size:14px;line-height:1;width:170px;padding:2px 6px;border:1px solid var(--line-hi);border-radius:5px;background:#fffdfa;color:inherit}
.wellh .colmb{margin-left:auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin-right:-6px;border:1px solid var(--line);background:transparent;font-weight:400;font-size:18px;line-height:1;color:var(--t-svc);cursor:pointer;border-radius:7px;transition:color .14s ease,border-color .14s ease,background .14s ease}
.wellh .colmb:hover{color:var(--accent);border-color:var(--line-hi);background:rgba(255,255,255,.5)}
.stack{flex:1;min-height:70px;overflow-y:auto;scrollbar-gutter:stable;padding:0 14px 0 20px;display:flex;flex-direction:column;gap:12px}
.stack.over{outline:2px dashed rgba(138,90,63,.28);outline-offset:-4px;border-radius:8px}
.wellh{cursor:grab}
.well.coldrag{outline:2px dashed var(--line-drag);outline-offset:-3px}
.well.colover{outline:2px dashed rgba(138,90,63,.4);outline-offset:-3px}
.addwrap{padding:14px 20px 20px}
.addbtn{width:100%;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:7px;font-weight:500;font-size:15px;line-height:1;opacity:.62;background:transparent;cursor:pointer;border:1px dashed}
.addbtn:hover{opacity:1}
.addcolwrap{padding-top:10px;text-align:right}
.addcolbtn{font-weight:500;font-size:14px;line-height:1;color:var(--t-mut);background:transparent;border:none;cursor:pointer;padding:4px 2px}
.addcolbtn:hover{color:var(--accent)}

/* карточка */
.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px 20px;
  box-shadow:0 4px 14px rgba(150,110,70,.09);cursor:grab;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(150,110,70,.16);border-color:var(--line-hi)}
.card.dragging{outline:2px dashed var(--line-drag);outline-offset:-2px}
.dropline{flex:none;height:4px;border-radius:3px;background:var(--line-drag);opacity:.85;margin:2px 0}
.card.heavy{border-color:var(--line-heavy);border-radius:8px;padding:24px 26px;box-shadow:0 16px 34px rgba(160,95,45,.2)}
.brow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card.heavy .brow{padding-bottom:0}
.badge{font-weight:600;font-size:12px;line-height:1;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px}
.card.heavy .badge{padding:6px 9px}
.mbtn{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-8px -10px 0 0;border:none;background:#f7f2ea;font-weight:400;font-size:18px;line-height:1;color:#9c948a;cursor:pointer;border-radius:7px;transition:background .14s ease,color .14s ease}
.mbtn:hover{color:var(--accent);background:#f0e7da}
.title{flex:1;font-weight:400;font-size:20px;line-height:1.42;color:var(--t-big);text-wrap:pretty}
.title b{font-weight:700}
.card.heavy .title{font-weight:400;font-size:23px;line-height:1.4;color:var(--t-big)}
.title textarea{width:100%;font:inherit;color:inherit;background:#fffdfa;border:1px solid var(--line-hi);border-radius:6px;padding:6px 8px;resize:vertical;min-height:60px}
.mrow{padding-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icechip.lead{flex:none;margin-top:2px}
.icechip{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:12px;line-height:1;color:var(--t-2nd);background:var(--chip-bg);padding:6px 9px;border-radius:5px}
.card.heavy .icechip{font-size:13px;color:var(--accent);background:#f9ede1;padding:7px 10px}
.segs{display:flex;gap:2px}
.seg{width:5px;height:11px;border-radius:1px;background:var(--seg-empty)}
.card.heavy .seg{height:12px}
.chip{font-weight:500;font-size:13px;line-height:1;padding:6px 11px;border-radius:5px;color:var(--t-2nd);background:var(--chip-bg)}
.chip.over{color:#fff;background:#c2551f}
.chip.warn{color:var(--t-h1);background:#f6e6d4}
.chip.crit{color:#fff;background:#c2401f}
.prog{padding-top:14px;padding-bottom:0;display:flex;align-items:center;gap:12px;cursor:pointer}
.bar{flex:1;height:3px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pcnt{font-weight:600;font-size:16px;line-height:1;color:#8a8279;flex:0 0 auto;min-width:42px;text-align:right;letter-spacing:.02em}
.parr{flex:0 0 36px;height:36px;margin-right:-10px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:#f7f2ea;font-size:16px;line-height:1;color:#9c948a;transition:color .15s ease,background .14s ease;user-select:none}
.prog:hover .parr{color:var(--accent);background:#f0e7da}

.subs{display:flex;flex-direction:column;gap:22px;margin-top:14px;padding-top:14px;border-top:1px solid var(--divider)}
.card.folded .subs{display:none}
.sub{position:relative;display:flex;align-items:flex-start;gap:14px}
.schk{flex:0 0 22px;display:flex;justify-content:center;margin-right:-3px}
.sdelw{position:absolute;right:-3px;top:23px;width:22px;height:18px;z-index:3;display:flex;align-items:center;justify-content:center}
.stx{font-weight:400;font-size:17px;line-height:1.45;color:#5f584f;flex:1}
.stx b{font-weight:700;color:var(--btone,var(--t-task))}
.sdel{font-weight:400;font-size:14px;line-height:1;color:#cfc5b6;cursor:pointer;visibility:hidden;padding:2px 5px;border-radius:4px}
.sub:hover .sdel{visibility:visible}
.sdel:hover{color:#c2551f;background:#f8ece4}
.cbx{width:22px;height:22px;border:1.5px solid #ddd3c6;border-radius:5px;flex:0 0 22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;line-height:1;color:transparent;background:#fff}

function autoSplit(s){
  const ci = s.indexOf(':');
  if(ci > 1 && ci <= 60) return [s.slice(0,ci).trim(), s.slice(ci+1).trim()];
  const m = s.match(/^(.{2,60}?[.!?])\s+(?=\S)/);
  if(m) return [m[1].replace(/[.!?]$/,'').trim(), s.slice(m[0].length).trim()];
  const d = s.match(/^(.{2,32}?)\s+[—–]\s+(.+)$/);

  return [null, s];
}

  const mh = menu.offsetHeight*SCALE, mw = (menu.offsetWidth||215)*SCALE;
  let top = y + 4;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, y - mh - 4);
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 10))+'px';
  menu.style.top = top+'px';
  menu.style.visibility='visible';
}
function menuAt(btn){ const r = btn.getBoundingClientRect(); placeMenu(r.left, r.bottom) }
function clampMenu(){ const r = menu.getBoundingClientRect();
  if(r.bottom > window.innerHeight - 8) menu.style.top = Math.max(8, window.innerHeight - 8 - menu.offsetHeight)+'px' }
function closeMenu(){ menu.style.display='none'; menu.dataset.for='' }
document.addEventListener('click', e=>{ if(!menu.contains(e.target)) closeMenu() });
function mk(label, fn, cls){ const b = el('button', cls||'', label); b.onclick=(e)=>{e.stopPropagation(); fn(e)}; menu.appendChild(b); return b }
function palette(colors, onPick){
  const g = el('div','palgrid');
  const n = el('div','sw none'); n.title='без цвета';
  n.onclick=(e)=>{e.stopPropagation(); onPick(null)}; g.appendChild(n);
  colors.forEach(h=>{ const s = el('div','sw'); s.style.background=h;
    s.onclick=(e)=>{e.stopPropagation(); onPick(h)}; g.appendChild(s) });
  menu.appendChild(g); clampMenu();
}

/* ── редактирование текста по двойному клику ── */
function inlineEdit(node, value, onSave, multiline){
  if(node.querySelector('input,textarea')) return;
  node.innerHTML = '';
  const f = document.createElement(multiline ? 'textarea' : 'input');
  f.className = multiline ? '' : 'subedit';
  f.value = value; node.appendChild(f); f.focus(); f.select();
  let done = false;
  const fin = (save)=>{ if(done) return; done = true;
    const v = f.value.trim();
    if(save && v && v !== value) onSave(v); else onSave(null);
  };
  f.onblur = ()=>fin(true);
  f.onkeydown = (e)=>{ e.stopPropagation();
    if(e.key==='Enter' && !(multiline && e.shiftKey)){ e.preventDefault(); fin(true) }
    if(e.key==='Escape') fin(false) };
}

/* ── карточка ── */
function renderCard(c, col, colIdx, heavy){
  const T = tone(colIdx, col);
  const d = el('div','card'+(heavy?' heavy':''));
  d.draggable = true; d.dataset.id = c.id;
  if(c.color) d.style.background = 'linear-gradient(rgba('+rgb(c.color)+',.15),rgba('+rgb(c.color)+',.15)), #fff';
  const [badge, title] = splitTitle(c.plain, c);

  d.style.borderLeft = c.prio===2 ? '5px solid #c2401f'
    : c.prio===1 ? '4px solid var(--accent)'
    : '3px solid '+(c.color || T.spine);

  const brow = el('div','brow');
  if(mode==='ice' && c.ice != null){
    const n0 = segCount(c.ice);
    let sg = ''; for(let i=0;i<4;i++) sg += '<span class="seg" style="'+(i<n0?'background:'+T.seg:'')+'"></span>';
    const ch = el('span','icechip lead','<span class="mono">'+c.ice+'</span><span class="segs">'+sg+'</span>');
    brow.appendChild(ch);
  }
  const t = el('div','title', (badge ? '<b style="color:'+T.tone+'">'+esc(badge)+'.</b> ' : '')+esc(title));
  brow.appendChild(t);
  const mb = el('button','mbtn','⋮');
  brow.appendChild(mb); d.appendChild(brow);
  t.ondblclick = (e)=>{ e.stopPropagation(); d.draggable=false;
    inlineEdit(t, c.plain, (v)=>{ d.draggable=true;
      if(v){ const old = c.plain; c.plain=v; c.short=shortOf(v);
        if(!c.badgeManual) delete c.badge;
        logChange('✏ переименована «'+old.slice(0,40)+'…» → «'+v+'» ('+proj().label+')'); }
      rerender();
    }, true) };

  const chips = [];
  if(false){
    const n = segCount(c.ice);
    let segs = ''; for(let i=0;i<4;i++) segs += '<span class="seg" style="'+(i<n?'background:'+T.seg:'')+'"></span>';
    chips.push('<span class="icechip"><span class="mono">'+(c.ice||'—')+'</span><span class="segs">'+segs+'</span></span>');
  }
  if(c.due){
    const [dv, tv] = c.due.split(' ');
    const over = new Date(dv+'T'+(tv||'23:59')) < new Date();
    const lbl = dv.slice(8,10)+'.'+dv.slice(5,7)+(tv?' '+tv:'');
    chips.push(over ? '<span class="chip over">просрочено · '+lbl+'</span>' : '<span class="chip">до '+lbl+'</span>');
  }
  if(c.prio===1) chips.push('<span class="chip warn">важно</span>');
  if(c.prio===2) chips.push('<span class="chip crit">критично</span>');
  if(c.desc) chips.push('<span class="chip dsc" title="есть описание">≡</span>');
  if(chips.length) d.appendChild(el('div','mrow', chips.join('')));

  if(c.subs && c.subs.length){
    const done = c.subs.filter(s=>s.done).length;
    const pr = el('div','prog','<span class="bar"><i style="width:'+Math.round(100*done/c.subs.length)+'%;background:'+T.seg+'"></i></span>'
      +'<span class="pcnt mono">'+done+'/'+c.subs.length+'</span><span class="parr">▾</span>');
    pr.onclick = (e)=>{ e.stopPropagation(); d.classList.toggle('folded'); c._fold = d.classList.contains('folded') };
    d.appendChild(pr);
    const box = el('div','subs'); box.style.setProperty('--btone', T.tone);
    c.subs.forEach(s=>{
      const li = el('div','sub'+(s.done?' done':''));
      const tx = el('span','stx', boldHead(s.plain));
      tx.ondblclick = (e)=>{ e.stopPropagation(); d.draggable=false;
        inlineEdit(tx, s.plain, (v)=>{ d.draggable=true;
          if(v){ const old=s.plain; s.plain=v;
            logChange('✏ подзадача «'+old.slice(0,35)+'…» → «'+v+'» в «'+c.short+'» ('+proj().label+')') }
          rerender();
        }) };
      const del = el('span','sdel','✕');
      del.onclick = (e)=>{ e.stopPropagation();
        c.subs.splice(c.subs.indexOf(s),1);
        logChange('✕ удалена подзадача «'+s.plain+'» из «'+c.short+'» ('+proj().label+')'); rerender() };
      const cb = el('span','cbx','✓');
      cb.onclick = (e)=>{ e.stopPropagation(); s.done = !s.done;
        if(s.done){ c.subs.splice(c.subs.indexOf(s),1); c.subs.push(s) }
        logChange((s.done?'✓ отмечена':'◻ снята')+' подзадача «'+s.plain+'» в «'+c.short+'» ('+proj().label+')'); rerender() };
      const chkw = el('span','schk'); chkw.appendChild(cb);
      const delw = el('span','sdelw'); delw.appendChild(del);
      li.append(tx, chkw, delw);
      li.draggable = true; li.dataset.sub = String(c.subs.indexOf(s));
      li.addEventListener('dragstart', ev=>{ ev.stopPropagation();
        window.__dragSub = {card:c, sub:s};
        if(ev.dataTransfer){ ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain','sub') }
        startGhost(li, ev);
        setTimeout(()=>li.classList.add('subdrag'),0); });
      li.addEventListener('dragend', ev=>{ ev.stopPropagation(); li.classList.remove('subdrag'); window.__dragSub = null });
      box.appendChild(li);
    });
    box.addEventListener('dragover', ev=>{
      const ds = window.__dragSub; if(!ds || ds.card !== c) return;
      ev.preventDefault(); ev.stopPropagation();
      const dr = box.querySelector('.sub.subdrag'); if(!dr) return;
      const items = [...box.querySelectorAll('.sub:not(.subdrag)')];
      let after=null, off=-Infinity;
      items.forEach(it=>{ const b=it.getBoundingClientRect(); const o=ev.clientY-b.top-b.height/2;
        if(o<0 && o>off){off=o; after=it} });
      if(after==null) box.appendChild(dr); else box.insertBefore(dr, after);
    });
    box.addEventListener('drop', ev=>{
      const ds = window.__dragSub; if(!ds || ds.card !== c) return;
      ev.preventDefault(); ev.stopPropagation(); window.__dragSub = null;
      const order = [...box.querySelectorAll('.sub')].map(x=>+x.dataset.sub);
      c.subs = order.map(i=>c.subs[i]);
      const pos = c.subs.indexOf(ds.sub);
      const prev = pos>0 ? c.subs[pos-1] : null;
      logChange('подзадача «'+ds.sub.plain.slice(0,40)+'» в «'+c.short+'»: переставлена '
        + (prev ? 'под «'+prev.plain.slice(0,30)+'»' : 'в начало'));
      rerender();
    });
    d.appendChild(box);
    if(c._fold) d.classList.add('folded');
  }

  mb.onclick = (e)=>{ e.stopPropagation();
    if(menu.style.display==='block' && menu.dataset.for===c.id){ closeMenu(); return }
    menu.dataset.for = c.id; cardMenu(mb, c, col, d) };
  d.addEventListener('dragstart', e=>{ window.__drag={id:c.id, col};
    if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', c.id) }
    startGhost(d, e);
    setTimeout(()=>d.classList.add('dragging'),0); });
  d.addEventListener('dragend', ()=>d.classList.remove('dragging'));
  return d;
}

function cardMenu(btn, c, col, cardEl){
  menu.innerHTML = '';
  const home = homeOf();
  mk('✓ Выполнена', ()=>{ closeMenu(); completeCard(c, col) });
  mk('＋ Подзадача', ()=>{ closeMenu(); addSub(c, cardEl) });
  if(home==='tactics'){
    mk('↓ На скамейку', ()=>{ closeMenu(); toQueue(c, col) });
    mk('↓ В идеи',    ()=>{ closeMenu(); toIdeas(c, col) });
  } else if(home==='queue'){
    mk('↑ В тактику', ()=>{ closeMenu(); toTactics(c, col) });
    mk('↓ В идеи',    ()=>{ closeMenu(); toIdeas(c, col) });
  } else {
    mk('↑ В тактику', ()=>{ closeMenu(); toTactics(c, col) });
    mk('↑ На скамейку', ()=>{ closeMenu(); toQueue(c, col) });
  }
  mk('⚑ Приоритет', ()=>{
    menu.innerHTML = '';
    [['Обычный',0],['Важный',1],['Критичный',2]].forEach(([l,v])=>{
      mk(((c.prio||0)===v?'● ':'○ ')+l, ()=>{ c.prio=v;
        logChange('⚑ приоритет «'+c.short+'» ('+proj().label+'): '+l); closeMenu(); rerender() });
    });
    clampMenu();
  });
  mk('◷ Дедлайн', ()=>{
    menu.innerHTML = '';
    const p = el('div','mpanel','<input type="date" id="mDate"><input type="time" id="mTime">');
    menu.appendChild(p);
    const parts = (c.due||'').split(' ');
    p.querySelector('#mDate').value = parts[0]||''; p.querySelector('#mTime').value = parts[1]||'';
    const r = el('div','mrow2');
    const rb = el('button','danger','Убрать'), sb = el('button','msave','Сохранить');
    rb.onclick=(e)=>{e.stopPropagation(); c.due=null; logChange('◷ дедлайн убран у «'+c.short+'» ('+proj().label+')'); closeMenu(); rerender()};
    sb.onclick=(e)=>{e.stopPropagation();
      const dv=p.querySelector('#mDate').value, tv=p.querySelector('#mTime').value;
      c.due = dv ? (dv+(tv?' '+tv:'')) : null;
      logChange('◷ дедлайн «'+c.short+'» ('+proj().label+'): '+(c.due||'убран')); closeMenu(); rerender()};
    r.append(rb, sb); menu.appendChild(r); clampMenu();
  });
  if(home==='queue'){
  mk('◆ Балл ICE', ()=>{
    menu.innerHTML='';
    const p = el('div','mpanel','<input id="mIce" type="number" placeholder="Балл (пусто — нет)">');
    menu.appendChild(p);
    p.querySelector('#mIce').value = (c.ice==null?'':c.ice);
    const r = el('div','mrow2');
    const rb = el('button','danger','Убрать'), sb = el('button','msave','Сохранить');
    rb.onclick=(e)=>{e.stopPropagation(); c.ice=null; logChange('◆ балл убран у «'+c.short+'» ('+proj().label+')'); closeMenu(); rerender()};
    sb.onclick=(e)=>{e.stopPropagation(); const v=p.querySelector('#mIce').value.trim();
      c.ice = v===''? null : +v;
      logChange('◆ балл «'+c.short+'» ('+proj().label+'): '+(c.ice==null?'убран':c.ice)); closeMenu(); rerender()};
    r.append(rb, sb); menu.appendChild(r); clampMenu();
  });
  }
  mk('≡ Описание', ()=>{ closeMenu(); openDesc(c) });
  mk('◐ Цвет задачи', (e)=>{ e.stopPropagation();
    if(menu.querySelector('.palgrid')){ menu.querySelector('.palgrid').remove(); return }
    palette(CARDTINT, (hex)=>{ c.color = hex;
      logChange(hex ? 'цвет «'+c.short+'» → '+hex+' ('+proj().label+')' : 'цвет снят у «'+c.short+'» ('+proj().label+')');
      closeMenu(); rerender() });
  });
  mk('✕ Удалить задачу', ()=>{ closeMenu();
    col.cards.splice(col.cards.indexOf(c),1);
    logChange('✕ удалена «'+c.short+'» ('+proj().label+', '+col.name+')'); rerender() }, 'danger');
  menuAt(btn);
}

function homeOf(){ return mode==='ideas' ? 'ideas' : mode==='ice' ? 'queue' : 'tactics' }
function targetProject(c){
  const rp = realProjects();
  return rp.find(p=>p.label===c.tag) || rp[projIdx] || rp[0];
}
function inboxCol(){
  let ib = DATA.projects.find(p=>p.id==='inbox');
  if(!ib){ ib = {id:'inbox', label:'Идеи', strategy:[], tactics:[{name:'Инбокс (до триажа)', cards:[], preset:0}], done:[]}; DATA.projects.push(ib) }
  if(!ib.tactics || !ib.tactics.length) ib.tactics = [{name:'Инбокс (до триажа)', cards:[], preset:0}];
  return ib.tactics[0];
}
function moveCard(c, col, dest, where){
  const from = proj().label + ', ' + col.name;
  col.cards.splice(col.cards.indexOf(c),1);
  dest.cards.unshift(c);
  logChange('→ «'+c.short+'» перенесена: '+from+' → '+where);
  rerender();
}
function toQueue(c, col){
  const tp = targetProject(c);
  if(!Array.isArray(tp.queue)) tp.queue = [{name:'Скамейка', cards:[], preset:3}];
  delete c.tag;
  moveCard(c, col, tp.queue[0], tp.label+', Скамейка');
}
function toTactics(c, col){
  const tp = targetProject(c);
  if(!tp.tactics || !tp.tactics.length) tp.tactics = [{name:'Делаю сейчас', cards:[], preset:0}];
  delete c.tag;
  moveCard(c, col, tp.tactics[0], tp.label+', '+tp.tactics[0].name);
}
function toIdeas(c, col){
  c.tag = proj().label;
  moveCard(c, col, inboxCol(), 'Идеи');
}
function completeCard(c, col){
  col.cards.splice(col.cards.indexOf(c),1);
  c.done = true; c.fromCol = col.name; c.doneAt = new Date().toISOString();
  const p = proj();
  if(!p.done || !p.done.length) p.done = [{name:'Выполнено', cards:[]}];
  p.done[0].cards.unshift(c);
  logChange('✓ «'+c.short+'» ('+p.label+') выполнена → Готово');
  rerender();
}
function addSub(c, cardEl){
  const inp = document.createElement('input');
  inp.className='subadd'; inp.placeholder='Текст подзадачи… (Enter)';
  cardEl.appendChild(inp); inp.focus();
  let done=false;
  const fin=(save)=>{ if(done) return; done=true; const v=inp.value.trim(); inp.remove();
    if(save && v){ c.subs = c.subs||[]; c.subs.push({plain:v, done:false}); c._fold = false;
      logChange('＋ подзадача «'+v+'» к «'+c.short+'» ('+proj().label+')'); rerender() } };
  inp.onkeydown=(e)=>{ e.stopPropagation(); if(e.key==='Enter')fin(true); if(e.key==='Escape')fin(false) };
  inp.onblur=()=>fin(true);
}
function openDesc(c){
  const m = document.getElementById('dm');
  document.getElementById('dTitle').textContent = c.plain;
  const ta = document.getElementById('dText'); ta.value = c.desc||'';
  m.style.display='flex'; ta.focus();
  document.getElementById('dCancel').onclick = ()=>{m.style.display='none'};
  document.getElementById('dSave').onclick = ()=>{
    const v = ta.value.trim();
    if(v !== (c.desc||'')){ c.desc = v||null;
      logChange('≡ описание «'+c.short+'» ('+proj().label+'): '+(v?'«'+v.slice(0,80)+(v.length>80?'…':'')+'»':'очищено')) }
    m.style.display='none'; rerender();
  };
}

/* ── колонки и доска ── */
function buildWell(col, i, cols, heavy){
  const T = tone(i, col);
  const w = el('div','well'+(heavy?' strat':'')); w.style.background = T.well;
  const h = el('div','wellh'); h.style.color = T.tone;
  const nm = el('span','wname', col.name); h.appendChild(nm);
  if(col.caption) h.appendChild(el('span','wcap', esc(col.caption)));
  const cmb = el('button','colmb','⋮'); h.appendChild(cmb); w.appendChild(h);
  h.draggable = true;
  h.addEventListener('dragstart', e=>{
    window.__dragCol = {col, cols};
    if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','col') }
    startGhost(w, e);
    setTimeout(()=>w.classList.add('coldrag'),0);
  });
  h.addEventListener('dragend', ()=>{ w.classList.remove('coldrag'); window.__dragCol = null;
    document.querySelectorAll('.well').forEach(x=>x.classList.remove('colover')) });
  w.addEventListener('dragover', e=>{
    const dc = window.__dragCol; if(!dc || dc.cols !== cols || dc.col === col) return;
    e.preventDefault(); w.classList.add('colover');
  });
  w.addEventListener('dragleave', ()=>w.classList.remove('colover'));
  w.addEventListener('drop', e=>{
    const dc = window.__dragCol; if(!dc || dc.cols !== cols || dc.col === col) return;
    e.preventDefault(); e.stopPropagation(); w.classList.remove('colover');
    const from = cols.indexOf(dc.col), to = cols.indexOf(col);
    cols.splice(from,1); cols.splice(to,0,dc.col);
    logChange('колонка «'+dc.col.name+'» ('+proj().label+'): перемещена на место «'+col.name+'»');
    window.__dragCol = null; rerender();
  });

  nm.ondblclick = ()=>inlineEdit(nm, col.name, (v)=>{
    const wasNew = !!col._new;
    if(v){
      const old = col.name; col.name = v;
      if(wasNew){ delete col._new;
        const k = changes.lastIndexOf('＋ колонка «Новая колонка» ('+proj().label+')');
        if(k > -1) changes[k] = '＋ колонка «'+v+'» ('+proj().label+')';
      } else logChange('✏ колонка «'+old+'» → «'+v+'» ('+proj().label+')');
    } else if(wasNew) delete col._new;
    rerender(); });
  if(PENDING_COL === col){ PENDING_COL = null; setTimeout(()=>nm.ondblclick(), 20) }

  const stack = el('div','stack'); stack.dataset.col = col.name;
  col.cards.forEach(c=>stack.appendChild(renderCard(c, col, i, heavy || (mode==='tactics' && i===0))));
  w.appendChild(stack);

  const aw = el('div','addwrap');
  const ab = el('button','addbtn', mode==='strategy' ? '+ стратегическая задача' : '+ задача');
  ab.style.color = T.tone; ab.style.borderColor = T.badge;
  ab.onclick = ()=>{
    const inp = document.createElement('input');
    inp.className='subadd'; inp.style.marginTop='0'; inp.placeholder='Текст задачи… (Enter)';
    aw.replaceChildren(inp); inp.focus();
    let done=false;
    const fin=(save)=>{ if(done) return; done=true; const v=inp.value.trim();
      if(save && v){ col.cards.unshift({id:newId('n'), plain:v, short:shortOf(v), ice:null, done:false, color:null, subs:[]});
        logChange('＋ задача «'+v+'» в '+col.name+' ('+proj().label+')') }
      rerender(); };
    inp.onkeydown=(e)=>{ e.stopPropagation(); if(e.key==='Enter')fin(true); if(e.key==='Escape')fin(false) };
    inp.onblur=()=>fin(true);
  };
  aw.appendChild(ab); w.appendChild(aw);

  const stackDragOver = e=>{
    if(window.__dragCol || !window.__drag) return;
    e.preventDefault(); stack.classList.add('over');
    const line = dropline();
    const dgid = window.__drag.id;
    const items = [...stack.querySelectorAll('.card')].filter(x=>x.dataset.id!==dgid);
    let after = null;
    for(const it of items){ const b = it.getBoundingClientRect();
      if(e.clientY < b.top + b.height/2){ after = it; break } }
    if(after) stack.insertBefore(line, after); else stack.appendChild(line);
  };
  const stackDrop = e=>{
    if(window.__dragCol) return;
    e.preventDefault(); e.stopPropagation(); stack.classList.remove('over');
    const dg = window.__drag; window.__drag = null; if(!dg) return;
    const src = dg.col, card = src.cards.find(x=>x.id===dg.id); if(!card) return;
    let pos = 0; const before = [];
    for(const k of [...stack.children]){
      if(k.classList.contains('dropline')) break;
      if(k.classList.contains('card') && k.dataset.id!==dg.id){ pos++; before.push(k.dataset.id) }
    }
    if(!stack.querySelector('.dropline')) pos = col.cards.length;
    src.cards.splice(src.cards.indexOf(card),1);
    if(pos > col.cards.length) pos = col.cards.length;
    col.cards.splice(pos, 0, card);
    const prevId = before.length ? before[before.length-1] : null;
    const prev = prevId ? col.cards.find(x=>x.id===prevId) : null;
    const place = prev ? 'под «'+prev.short+'»' : 'в начало';
    if(src === col) logChange('«'+card.short+'» ('+proj().label+', '+col.name+'): переставлена '+place);
    else logChange('«'+card.short+'» ('+proj().label+'): '+src.name+' → '+col.name+', '+place);
    rerender();
  };
  stack.addEventListener('dragover', stackDragOver);
  stack.addEventListener('dragleave', ()=>stack.classList.remove('over'));
  stack.addEventListener('drop', stackDrop);
  w.addEventListener('dragover', stackDragOver);
  w.addEventListener('drop', stackDrop);

  cmb.onclick = (e)=>{
    e.stopPropagation();
    if(menu.style.display==='block' && menu.dataset.for==='col:'+col.name){ closeMenu(); return }
    menu.dataset.for = 'col:'+col.name;
    menu.innerHTML='';
    mk('◐ Тон колонки', (ev)=>{ ev.stopPropagation();
      if(menu.querySelector('.palgrid')){ menu.querySelector('.palgrid').remove(); return }
      palette(TONES.map(t=>t.well), (hex)=>{
        const idx = TONES.findIndex(t=>t.well===hex);
        col.preset = idx < 0 ? null : idx;
        logChange('тон колонки «'+col.name+'» → '+(idx<0?'по умолчанию':'вариант '+(idx+1))+' ('+proj().label+')');
        closeMenu(); rerender(); });
    });
    mk('＋ Колонка справа', ()=>{ closeMenu(); addColumnAfter(cols, cols.indexOf(col)) });
    if(mode==='ice') mk('⇅ Отсортировать по баллу', ()=>{ closeMenu();
      sortQueue(); logChange('⇅ Скамейка отсортирована по баллу ('+proj().label+')'); rerender() });
    mk('✕ Удалить колонку', ()=>{ closeMenu();
      const n = col.cards.length;
      cols.splice(cols.indexOf(col),1);
      logChange('✕ удалена колонка «'+col.name+'»'+(n?' (с '+n+' задачами)':'')+' ('+proj().label+')'); rerender() }, 'danger');
    menuAt(cmb);
  };
  return w;
}

let PENDING_COL = null;
function addColumnAfter(cols, idx){
  const col = {name:'Новая колонка', cards:[], _new:true};
  cols.splice(idx+1, 0, col);
  PENDING_COL = col;
  logChange('＋ колонка «Новая колонка» ('+proj().label+')');
  rerender();
}
function buildBoard(cols, heavy){
  const wrap = el('div','');
  const b = el('div','board');
  b.style.gridTemplateColumns = 'repeat('+Math.max(cols.length,3)+', minmax(0,1fr))';
  cols.forEach((col,i)=>b.appendChild(buildWell(col, i, cols, heavy)));
  const aw2 = el('div','addcolwrap');
  aw2.style.gridColumn = String(Math.max(cols.length,1));
  const add = el('button','addcolbtn','+ колонка');
  add.style.display = cols.length ? 'none' : 'inline-block';
  add.onclick = ()=>{
    const inp = document.createElement('input');
    inp.className='subadd'; inp.style.marginTop='0'; inp.style.width='170px';
    inp.placeholder='Название… (Enter)';
    add.replaceWith(inp); inp.focus();
    let done=false;
    const fin=(save)=>{ if(done) return; done=true; const v=inp.value.trim();
      if(save && v){ cols.push({name:v, cards:[]}); logChange('＋ колонка «'+v+'» ('+proj().label+')') }
      rerender(); };
    inp.onkeydown=(e)=>{ e.stopPropagation(); if(e.key==='Enter')fin(true); if(e.key==='Escape')fin(false) };
    inp.onblur=()=>fin(true);
  };
  aw2.appendChild(add); b.appendChild(aw2); wrap.appendChild(b);
  return wrap;
}

/* ── режимы ── */
function viewTactics(){ const v = el('div','view on'); v.appendChild(buildBoard(proj().tactics, false)); return v }
function viewStrategy(){
  const v = el('div','view on'); const wrap = el('div','stratwrap');
  const cols = proj().strategy;
  if(!cols.length){ cols.push({name:'Стратегия', cards:[]}) }
  wrap.appendChild(buildBoard(cols, true)); v.appendChild(wrap); return v;
}
function queueCols(){ const p = proj(); if(!Array.isArray(p.queue)) p.queue = [{name:'Скамейка', cards:[], preset:3}]; return p.queue }
function sortQueue(){
  queueCols().forEach(col=>{
    col.cards.sort((a,b)=>{
      const ia = (a.ice==null?-1:a.ice), ib2 = (b.ice==null?-1:b.ice); return ib2-ia;
    });
  });
}
function viewIce(){
  const v = el('div','view on qview'); const wrap = el('div','queuewrap');
  const cols = queueCols();
  wrap.appendChild(buildBoard(cols, false));
  const bd = wrap.querySelector('.board'); if(bd) bd.style.gridTemplateColumns = '1fr';
  const st = wrap.querySelector('.stack');
  if(st && !st.children.length) st.appendChild(el('div','empty','Пусто. Переноси сюда задачи из Тактики через меню карточки — они будут ждать своего часа, отсортированные по баллу.'));
  v.appendChild(wrap); return v;
}
function viewDone(){
  const v = el('div','view on');
  const p = proj();
  const all = (p.done||[]).flatMap(col=>col.cards.map(c=>({c, group:col.name, col})));
  const now = Date.now();
  const cut = donePeriod==='week' ? 7*864e5 : donePeriod==='month' ? 31*864e5 : donePeriod==='quarter' ? 92*864e5 : null;
  const list = all.filter(({c})=> !cut || (c.doneAt && (now - new Date(c.doneAt).getTime()) <= cut));
  const sum = el('div','summary');
  sum.appendChild(el('span','st','Закрыто: <b>'+list.length+'</b>'));
  const per = el('div','periods');
  [['week','Неделя'],['month','Месяц'],['quarter','Квартал'],['all','Всё']].forEach(([k,l])=>{
    const b = el('button','per'+(donePeriod===k?' on':''), l);
    b.onclick = ()=>{ donePeriod=k; rerender() }; per.appendChild(b);
  });
  sum.appendChild(per); v.appendChild(sum);
  const rows = el('div','rows');
  if(!list.length) rows.appendChild(el('div','empty','За выбранный период ничего не закрыто.'));
  list.forEach(({c, col})=>{
    const [badge, ttl] = splitTitle(c.plain, c);
    const r = el('div','drow');
    r.innerHTML = '<span class="dchk">✓</span>'
      + (badge ? '<span class="dbadge">'+esc(badge)+'</span>' : '')
      + '<span class="dtx">'+esc(ttl)+'</span>'
      + '<span class="dtime mono">'+(c.doneAt ? fmtDone(c.doneAt) : '—')+'</span>';
    const rb = el('button','rst','↩ Вернуть');
    rb.onclick = ()=>{
      col.cards.splice(col.cards.indexOf(c),1);
      const target = p.tactics.find(x=>x.name===c.fromCol) || p.tactics[0];
      if(target){ c.done=false; delete c.doneAt; target.cards.unshift(c);
        logChange('↩ «'+c.short+'» ('+p.label+') возвращена в '+target.name) }
      rerender();
    };
    r.appendChild(rb); rows.appendChild(r);
  });
  v.appendChild(rows); return v;
}
function fmtDone(iso){ const d = new Date(iso);
  const p = n=>String(n).padStart(2,'0');
  return p(d.getDate())+'.'+p(d.getMonth()+1)+' · '+p(d.getHours())+':'+p(d.getMinutes()) }

function viewIdeas(){
  const v = el('div','view on'); const p = ideasProj();
  const col = p.tactics[0] || (p.tactics[0] = {name:'Идеи', cards:[]});
  const inp = document.createElement('input');
  inp.className='ideaadd'; inp.placeholder='+ идея';
  inp.onkeydown = (e)=>{ e.stopPropagation();
    if(e.key==='Enter'){ const val = inp.value.trim(); if(!val) return;
      col.cards.unshift({id:newId('i'), plain:val, short:shortOf(val), ice:null, done:false, color:null, subs:[], tag:null});
      logChange('＋ идея «'+val+'»'); inp.value=''; rerender() } };
  v.appendChild(inp);
  const rows = el('div','rows');
  if(!col.cards.length) rows.appendChild(el('div','empty','Пока пусто. Запиши первую идею в поле выше.'));
  col.cards.forEach(c=>{
    const r = el('div','idea'); r.draggable = true; r.dataset.id = c.id;
    const tx = el('span','itx2', boldHead(c.plain, c));
    tx.ondblclick = ()=>{ r.draggable=false;
      inlineEdit(tx, c.plain, (val)=>{ r.draggable=true;
        if(val){ const old=c.plain; c.plain=val; c.short=shortOf(val);
          logChange('✏ идея «'+old.slice(0,35)+'…» → «'+val+'»') } rerender() }) };
    r.appendChild(tx);
    if(c.tag){ const i = realProjects().findIndex(x=>x.label===c.tag);
      r.appendChild(el('span','itag'+(i===0?' t1':i===1?' t2':''), esc(c.tag))) }
    const mb = el('button','ibtn','⋮'), db = el('button','ibtn del','✕');
    r.append(mb, db); rows.appendChild(r);
    db.onclick = (e)=>{ e.stopPropagation(); col.cards.splice(col.cards.indexOf(c),1);
      logChange('✕ удалена идея «'+c.plain+'»'); rerender() };
    mb.onclick = (e)=>{ e.stopPropagation();
      if(menu.style.display==='block' && menu.dataset.for==='idea:'+c.id){ closeMenu(); return }
      menu.dataset.for = 'idea:'+c.id;
      menu.innerHTML='';
      mk('→ Превратить в задачу', ()=>{
        menu.innerHTML='';
        realProjects().forEach((pr)=>{
          pr.tactics.forEach(tc=>{
            mk(pr.label+' → '+tc.name, ()=>{
              tc.cards.unshift({id:newId('t'), plain:c.plain, short:c.short, ice:null, done:false, color:null, subs:[]});
              col.cards.splice(col.cards.indexOf(c),1);
              logChange('→ идея «'+c.plain+'» превращена в задачу: '+pr.label+' / '+tc.name);
              closeMenu(); rerender();
            });
          });
        });
        clampMenu();
      });
      mk('→ На скамейку', ()=>{
        menu.innerHTML='';
        realProjects().forEach((pr)=>{
          mk(pr.label, ()=>{
            if(!Array.isArray(pr.queue)) pr.queue = [{name:'Скамейка', cards:[], preset:3}];
            pr.queue[0].cards.unshift({id:newId('t'), plain:c.plain, short:c.short, ice:null, done:false, color:null, subs:[]});
            col.cards.splice(col.cards.indexOf(c),1);
            logChange('→ идея «'+c.plain+'» перенесена на Скамейку: '+pr.label);
            closeMenu(); rerender();
          });
        });
        clampMenu();
      });
      mk('◈ Метка проекта', ()=>{
        menu.innerHTML='';
        realProjects().map(x=>x.label).concat(['без метки']).forEach(lbl=>{
          mk(((c.tag===lbl)||(!c.tag&&lbl==='без метки')?'● ':'○ ')+lbl, ()=>{
            c.tag = lbl==='без метки' ? null : lbl;
            logChange('◈ метка идеи «'+c.short+'» → '+lbl); closeMenu(); rerender() });
        });
        clampMenu();
      });
      mk('✕ Удалить идею', ()=>{ closeMenu(); col.cards.splice(col.cards.indexOf(c),1);
        logChange('✕ удалена идея «'+c.plain+'»'); rerender() }, 'danger');
      menuAt(mb) };
    r.addEventListener('dragstart', e=>{ window.__dragIdea = c;
      if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', c.id) }
      startGhost(r, e);
      setTimeout(()=>r.classList.add('dragging'),0); });
    r.addEventListener('dragend', ()=>r.classList.remove('dragging'));
  });
  rows.addEventListener('dragover', e=>{
    e.preventDefault();
    const dr = rows.querySelector('.idea.dragging'); if(!dr) return;
    const items = [...rows.querySelectorAll('.idea:not(.dragging)')];
    let after=null, off=-Infinity;
    items.forEach(it=>{ const b=it.getBoundingClientRect(); const o=e.clientY-b.top-b.height/2;
      if(o<0 && o>off){off=o; after=it} });
    if(after==null) rows.appendChild(dr); else rows.insertBefore(dr, after);
  });
  rows.addEventListener('drop', e=>{
    e.preventDefault(); const c = window.__dragIdea; window.__dragIdea = null; if(!c) return;
    const order = [...rows.querySelectorAll('.idea')].map(x=>x.dataset.id);
    col.cards.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    const pos = order.indexOf(c.id);
    const prev = pos>0 ? col.cards.find(x=>x.id===order[pos-1]) : null;
    logChange('идея «'+c.short+'»: переставлена '+(prev?'под «'+prev.short+'»':'в начало списка'));
    rerender();
  });
  v.appendChild(rows); return v;
}

/* ── сборка экрана ── */
const MODES = [['ice','Скамейка'],['tactics','Тактика'],['done','Готово']];
function modeLabel(k, def){ return (DATA.modeLabels && DATA.modeLabels[k]) || def }
function bindDual(btn, onClick, onDbl){
  let timer = null;
  btn.onclick = ()=>{ if(timer) return; timer = setTimeout(()=>{ timer = null; onClick() }, 190) };
  btn.ondblclick = (e)=>{ e.stopPropagation(); if(timer){ clearTimeout(timer); timer = null } onDbl() };
}
function renameMode(node, k, def){
  const cur = modeLabel(k, def);
  inlineEdit(node, cur, (v)=>{
    if(v){ DATA.modeLabels = DATA.modeLabels || {}; DATA.modeLabels[k] = v;
      logChange('✏ пункт меню «'+cur+'» → «'+v+'»') }
    rerender(); });
}
function ideasProj(){ return DATA.projects.find(p=>p.id==='inbox') }
function realProjects(){ return DATA.projects.filter(p=>p.id!=='inbox') }
function rerender(){
  closeMenu();
  const mr = document.getElementById('modes'); mr.innerHTML='';
  const sb0 = el('button','mode'+(mode==='strategy'?' on':''), esc(modeLabel('strategy','Стратегия')));
  bindDual(sb0, ()=>{ mode='strategy'; rerender() }, ()=>renameMode(sb0, 'strategy', 'Стратегия'));
  mr.appendChild(sb0);
  mr.appendChild(el('div','mdiv'));
  MODES.forEach(([k,l])=>{
    const b = el('button','mode'+(mode===k?' on':''), esc(modeLabel(k,l)));
    bindDual(b, ()=>{ mode=k; rerender() }, ()=>renameMode(b, k, l));
    mr.appendChild(b);
  });
  const ib2 = document.getElementById('ideasBtn'), tb2 = document.getElementById('tasksBtn');
  const isIdeas = mode==='ideas';
  ib2.classList.toggle('on', isIdeas);
  tb2.classList.toggle('on', !isIdeas);
  ib2.textContent = modeLabel('ideas','Идеи');
  tb2.textContent = modeLabel('home','Мои задачи');
  bindDual(ib2, ()=>{ if(mode!=='ideas'){ LASTMODE = mode; mode='ideas'; rerender() } },
                ()=>renameMode(ib2, 'ideas', 'Идеи'));
  bindDual(tb2, ()=>{ if(mode==='ideas'){ mode = LASTMODE || 'tactics'; rerender() } },
                ()=>renameMode(tb2, 'home', 'Мои задачи'));
  document.getElementById('modeswrap').style.visibility = isIdeas ? 'hidden' : 'visible';
  document.getElementById('projs').style.visibility = isIdeas ? 'hidden' : 'visible';
  const pr = document.getElementById('projs'); pr.innerHTML='';
  realProjects().forEach((x,i)=>{
    const b = el('button','proj'+(i===projIdx?' on':''), esc(x.label));
    bindDual(b, ()=>{ projIdx=i; rerender() },
      ()=>inlineEdit(b, x.label, (v)=>{ if(v){ const old=x.label; x.label=v;
        logChange('✏ проект «'+old+'» переименован в «'+v+'»') } rerender() }));
    pr.appendChild(b);
  });
  const c = document.getElementById('content'); c.innerHTML='';
  c.appendChild(mode==='ideas' ? viewIdeas()
    : mode==='tactics' ? viewTactics()
    : mode==='strategy' ? viewStrategy()
    : mode==='ice' ? viewIce() : viewDone());
  updateFoot();
}
function updateFoot(){
  const c1 = document.getElementById('copyBtn'), c2 = document.getElementById('clearBtn');
  const box = document.getElementById('cntBox');
  const dirty = changes.length > 0;
  box.classList.toggle('show', dirty);
  if(dirty) box.textContent = changes.length+' изм.';
  c2.textContent = mode==='done' && !dirty ? 'Выгрузить' : 'Сброс';
  c1.textContent = TEMPLBL ? TEMPLBL
    : dirty ? (COPIED ? 'В буфере' : 'Сохранить')
    : (mode==='strategy' ? 'В тактику' : mode==='done' ? 'Итог недели' : 'Сохранить');
  c1.classList.toggle('copied', !!(dirty && COPIED) || !!TEMPLBL);
  c1.dataset.act = dirty ? 'apply' : (mode==='strategy' ? 'toTactics' : mode==='done' ? 'weekly' : 'apply');
  if(mode==='ideas' && !dirty && !TEMPLBL){ c1.textContent='Сохранить'; c1.dataset.act='apply' }
  c2.dataset.act = (mode==='done' && !dirty) ? 'export' : 'reset';
  c1.style.opacity = (c1.dataset.act==='apply' && !dirty) ? '.45' : '1';
}
function changeText(){ return 'Внедри изменения в доски задач:\n— ' + changes.join('\n— ') }
window.addEventListener('beforeunload', (e)=>{
  if(changes.length){ e.preventDefault(); e.returnValue = '' }
});

/* ── подвал ── */
let COPIED = false, TEMPLBL = null;
function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false }
}
function toClipboard(text, after){
  const ok = ()=>{ if(after) after() };
  if(legacyCopy(text)){ ok(); return }
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok).catch(()=>manualCopy(text));
  else manualCopy(text);
}
function tempLabel(btn, text){
  TEMPLBL = text; updateFoot();
  setTimeout(()=>{ TEMPLBL = null; updateFoot() }, 2600);
}
function manualCopy(text){
  const m = document.getElementById('dm');
  document.getElementById('dTitle').textContent = 'Скопируй текст и вставь в чат';
  const ta = document.getElementById('dText'); ta.value = text;
  m.style.display='flex'; ta.focus(); ta.select();
  document.getElementById('dCancel').onclick = ()=>{m.style.display='none'};
  document.getElementById('dSave').onclick = ()=>{ try{document.execCommand('copy')}catch(e){}; m.style.display='none' };
}
function doneList(days){
  const now = Date.now();
  return (proj().done||[]).flatMap(col=>col.cards)
    .filter(c=>!days || (c.doneAt && (now-new Date(c.doneAt).getTime()) <= days*864e5));
}
document.getElementById('copyBtn').onclick = (e)=>{
  const act = e.currentTarget.dataset.act;
  if(act==='apply'){
    if(!changes.length) return;
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    ghSave(DATA).then(()=>{
      SAVED = JSON.parse(JSON.stringify(DATA));
      changes.length = 0; btn.disabled = false; tempLabel(btn,'Сохранено');
    }).catch(err=>{
      btn.disabled = false; updateFoot();
      alert('Не удалось сохранить в GitHub: '+err.message);
    });
  } else if(act==='toTactics'){ mode='tactics'; rerender() }
  else if(act==='weekly'){
    const l = doneList(7);
    const txt = 'Итог недели · '+proj().label+' · закрыто '+l.length+':\n'
      + l.map(c=>'— '+c.plain+(c.doneAt?' ('+fmtDone(c.doneAt)+')':'')).join('\n');
    toClipboard(txt, ()=>tempLabel(null,'В буфере'));
  }
};
document.getElementById('clearBtn').onclick = (e)=>{
  if(e.currentTarget.dataset.act==='export'){
    const l = doneList(donePeriod==='week'?7:donePeriod==='month'?31:donePeriod==='quarter'?92:null);
    toClipboard('Выполнено · '+proj().label+':\n'+l.map(c=>'— '+c.plain).join('\n'), ()=>tempLabel(null,'В буфере'));
    return;
  }
  DATA = JSON.parse(JSON.stringify(SAVED)); changes.length = 0; rerender();
};
document.addEventListener('contextmenu', e=>{
  const tg = e.target;
  if(tg && (tg.tagName==='INPUT' || tg.tagName==='TEXTAREA')){
    e.preventDefault(); menu.innerHTML='';
    const b = mk('Вставить из буфера', ()=>{
      if(navigator.clipboard && navigator.clipboard.readText){
        navigator.clipboard.readText().then(txt=>{
          const s = tg.selectionStart ?? tg.value.length, en = tg.selectionEnd ?? tg.value.length;
          tg.value = tg.value.slice(0,s)+txt+tg.value.slice(en);
          tg.focus(); tg.selectionStart = tg.selectionEnd = s+txt.length; closeMenu();
        }).catch(()=>{ b.textContent = 'Доступ закрыт — нажми Ctrl+V' });
      } else b.textContent = 'Нажми Ctrl+V';
    });
    b.onmousedown = ev=>ev.preventDefault();
    placeMenu(e.clientX, e.clientY);
  }
});
fitStage();
rerender();
</script>
</body></html>
